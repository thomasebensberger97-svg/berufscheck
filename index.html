<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berufs-Check – Welcher Beruf passt zu mir?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F5F9; --card:#FFFFFF; --ink:#13315C; --muted:#4F6180; --line:#D3DCE8;
  --marker:#FFD23F; --marker-ink:#13315C; --accent:#1B5FAA; --on-accent:#FFFFFF;
  --mint:#2E8F6E; --mint-soft:#DDF1E9; --focus:#1B5FAA;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B2D; --card:#172740; --ink:#EAF0F8; --muted:#A9B8CE; --line:#2B3F5E;
    --marker:#F2C230; --marker-ink:#13213A; --accent:#78AEF2; --on-accent:#0F1B2D;
    --mint:#5CC9A2; --mint-soft:#18392F; --focus:#F2C230;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B2D; --card:#172740; --ink:#EAF0F8; --muted:#A9B8CE; --line:#2B3F5E;
  --marker:#F2C230; --marker-ink:#13213A; --accent:#78AEF2; --on-accent:#0F1B2D;
  --mint:#5CC9A2; --mint-soft:#18392F; --focus:#F2C230;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:700px;margin:0 auto;padding:18px 18px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px}
.brand span.dot{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--marker);transform:rotate(-8deg)}
.top small{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
h1{font-size:2.1rem;line-height:1.15;margin:0 0 14px}
h2{font-size:1.4rem;line-height:1.25;margin:0 0 10px}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.mark{background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 2px}
.feat{list-style:none;padding:0;margin:18px 0 24px;display:grid;gap:10px}
.feat li{display:flex;gap:12px;align-items:flex-start}
.feat .em{font-size:1.35rem;line-height:1.3}
button{font:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.btn{font-weight:700;padding:14px 22px;border-radius:12px;border:2px solid transparent;cursor:pointer;min-height:54px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.part{font-weight:700;color:var(--muted);font-size:.95rem;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress>div{height:100%;background:var(--marker);border-right:3px solid var(--ink);transition:width .35s ease}
.qhead{display:flex;gap:14px;align-items:flex-start}
.qem{font-size:2.2rem;line-height:1.1}
.q{font-size:1.55rem;font-weight:700;line-height:1.3;margin:0}
.q:focus{outline:none}
.hint{color:var(--muted);margin:8px 0 0}
.speak{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:transparent;border:2px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.95rem}
.speak:hover{border-color:var(--ink)}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:60px;transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--ink)}
.opt .em{font-size:1.45rem;width:1.9rem;text-align:center;flex:none}
.opt .box{margin-left:auto;flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.opt.single .box{border-radius:50%}
.opt[aria-pressed="true"]{background:var(--marker);color:var(--marker-ink);border-color:var(--marker-ink)}
.opt[aria-pressed="true"] .box{border-color:var(--marker-ink);background:var(--marker-ink);color:var(--marker)}
input[type=text]{width:100%;margin-top:20px;padding:15px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:26px;flex-wrap:wrap}
.skip{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 4px}
/* Ergebnis */
.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.jobs{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:14px}
.job{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:18px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.job:first-child{border:2px solid var(--ink)}
.rank{font-size:2.3rem;font-weight:700;line-height:1;min-width:2.2ch;text-align:center;color:var(--ink)}
.job:nth-child(-n+3) .rank{background:linear-gradient(transparent 50%,var(--marker) 50%)}
.job h3{margin:0 0 4px;font-size:1.25rem;line-height:1.3}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.tag{font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted)}
.tag.fit{background:var(--mint-soft);color:var(--mint);border-color:transparent}
.why{margin:0 0 6px}
.what{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.note{font-size:.9rem;color:var(--muted);margin:0 0 10px}
.search{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);text-decoration:none;border-bottom:2px solid currentColor;padding-bottom:1px;font-size:.95rem}
.box-info{margin-top:26px;padding:20px;border-radius:14px;background:var(--mint-soft)}
.box-info h2{color:var(--ink)}
.box-info ol{margin:0;padding-left:1.3em;display:grid;gap:8px}
.dream{margin-top:14px;padding:14px 16px;border-left:5px solid var(--marker);background:var(--bg);border-radius:0 10px 10px 0}
details{margin-top:26px;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
summary{cursor:pointer;font-weight:700}
textarea{width:100%;min-height:280px;margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.45}
.foot{margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.langsel{display:inline-flex;align-items:center;gap:6px;font-size:.95rem}
.langsel select{font:inherit;font-size:.9rem;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:11rem}
.langpick{margin:6px 0 18px;padding:16px;border-radius:14px;background:var(--bg)}
.lp-label{font-weight:700;margin:0 0 10px}
.lp-row{display:flex;flex-wrap:wrap;gap:8px}
.lp{font-size:.95rem;padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.lp.on{background:var(--marker);color:var(--marker-ink);border-color:var(--marker-ink);font-weight:700}
.tr{margin:8px 0 0;color:var(--accent);font-size:1.08rem;line-height:1.5}
.langpick .tr{margin-top:14px}
.trh{color:var(--accent);opacity:.85}
.ot{display:flex;flex-direction:column;gap:2px}
.otr{font-size:.88rem;color:var(--muted)}
.opt[aria-pressed="true"] .otr{color:var(--marker-ink);opacity:.8}
[dir="rtl"]{text-align:right}
.fitrow{display:flex;align-items:center;gap:10px;margin:4px 0 6px;font-size:.95rem}
.fitbar{flex:1;max-width:220px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.fitbar>div{height:100%;background:var(--mint)}
.sim{font-size:.95rem;margin:0 0 10px}
.extra{margin-top:28px}
.extra h2{margin-bottom:4px}
.fields{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:12px}
.fields li{display:grid;grid-template-columns:2rem 1fr auto;column-gap:10px;row-gap:5px;align-items:center}
.fields .fe{font-size:1.3rem}
.fields .fitbar{grid-column:2/4;max-width:none}
.more{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.more li{display:grid;grid-template-columns:2.6rem 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.more li:first-child{border-top:none}
.more .mr{font-weight:700;color:var(--muted)}
.more small{font-size:.85rem}
.pdfbox{margin-top:22px;padding:20px;border:2px dashed var(--ink);border-radius:14px}
.pdfbox h2{margin-bottom:12px}
.pdfbox label{font-weight:700;display:block}
.pdfbox input[type=text]{margin:8px 0 14px}
.pdfbox p{margin:12px 0 0}
@media (max-width:480px){
  body{font-size:18px}
  h1{font-size:1.8rem}
  .q{font-size:1.35rem}
  .card{padding:22px 16px}
  .job{padding:16px 14px;gap:12px}
  .rank{font-size:1.9rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

</div>

function similar(j,topIds,okIds){

  const pickR=rel.filter(o=>!topIds.has(o.id)).concat(rel.filter(o=>topIds.has(o.id))).slice(0,3);
  if(pickR.length>=3) return pickR;
  const c=JOBS.filter(o=>o.id!==j.id&&okIds.has(o.id)).map(o=>({o,s:cos(vec(j),vec(o))+(o.fam===j.fam?0.25:0)})).sort((a,b)=>b.s-a.s);
  const pick=c.filter(x=>!topIds.has(x.o.id)).slice(0,3);
  c.forEach(x=>{if(pick.length<3&&!pick.includes(x)) pick.push(x);});
  const out=pickR.slice(); pick.forEach(x=>{if(out.length<3&&!out.includes(x.o)) out.push(x.o);}); return out;
}

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(KEY);}catch(e){}}
function visible(){return Q.filter(q=>!q.showIf||q.showIf(A));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function speak(text){try{const s=window.speechSynthesis; if(!s) return; s.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=.9; s.speak(u);}catch(e){}}
function canSpeak(){try{return 'speechSynthesis' in window;}catch(e){return false;}}

/* ---------- Startseite ---------- */
function renderStart(){
  screen='start';
  const saved=load(); const hasSaved=saved&&saved.A&&Object.keys(saved.A).length>0;
  app.innerHTML=`
    <h1>Welcher Beruf <span class="mark">passt zu mir?</span></h1>
    <p>Du beantwortest bis zu ${Q.length} kurze Fragen. Das dauert etwa 15 bis 20 Minuten.</p>
    <p>Es gibt keine falschen Antworten. Am Ende bekommst du dein Ergebnisblatt mit 10 Berufen, die zu dir passen.</p>
    <div class="langpick">
      <p class="lp-label">Brauchst du eine Übersetzung? <span class="muted">Translation?</span></p>
      <div class="lp-row">${LANGS.map(x=>`<button class="lp ${x.c===L?'on':''}" data-l="${x.c}" aria-pressed="${x.c===L}" lang="${x.c}">${x.n}</button>`).join('')}</div>
      ${L!=='de'?`<p class="tr" ${trAttr()}>${esc(TR_INTRO[L]||'')}</p>`:''}
    </div>
    <ul class="feat">
      ${canSpeak()?'<li><span class="em" aria-hidden="true">🔊</span><span>Du kannst dir jede Frage vorlesen lassen.</span></li>':''}
      <li><span class="em" aria-hidden="true">⏭️</span><span>Du kannst Fragen überspringen.</span></li>
      <li><span class="em" aria-hidden="true">🔒</span><span>Deine Antworten bleiben auf diesem Gerät.</span></li>
    </ul>
    <div class="row">
      ${hasSaved?'<button class="btn primary" id="resume">Weitermachen</button><button class="btn ghost" id="fresh">Neu anfangen</button>':'<button class="btn primary" id="go">Los geht\'s</button>'}
    </div>`;
  app.querySelectorAll('.lp').forEach(b=>b.onclick=()=>{L=b.dataset.l; document.getElementById('lang').value=L; save(); renderStart();});
  const go=document.getElementById('go'); if(go) go.onclick=()=>{A={};cur=Q[0].id;renderQ();};
  const r=document.getElementById('resume'); if(r) r.onclick=()=>{A=saved.A||{};cur=saved.cur;if(cur==='__result') renderResult(); else renderQ();};
  const f=document.getElementById('fresh'); if(f) f.onclick=()=>{clearSave();A={};cur=Q[0].id;renderQ();};
}

/* ---------- Frage ---------- */
function renderQ(){
  screen='q';
  const V=visible(); let i=V.findIndex(q=>q.id===cur); if(i<0){i=0;cur=V[0].id;}
  const q=V[i]; const val=A[q.id];
  const pct=Math.round(i/V.length*100);
  let body='';
  if(q.type==='single'||q.type==='multi'){
    body='<div class="opts" role="group" aria-label="Antworten">'+q.opts.map(o=>{
      const on=q.type==='single'?val===o.v:has(val,o.v);
      const ot=tr(o.t);
      return `<button class="opt ${q.type}" data-v="${o.v}" aria-pressed="${on}"><span class="em" aria-hidden="true">${o.e||''}</span><span class="ot">${esc(o.t)}${ot?`<span class="otr" ${trAttr()}>${esc(ot)}</span>`:''}</span><span class="box" aria-hidden="true">${on?'✓':''}</span></button>`;
    }).join('')+'</div>';
  } else {
    body=`<input type="text" id="txt" placeholder="${esc(q.ph||'')}" value="${esc(val||'')}" autocomplete="off" aria-label="${esc(q.q)}">`;
  }
  const canNext=q.type==='text'||(q.type==='single'?!!val:has(val,val&&val[0]));
  app.innerHTML=`
    <div class="part"><span>Teil ${q.teil+1} von 5: ${TEILE[q.teil]}</span><span>Frage ${i+1} von ${V.length}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div style="width:${Math.max(pct,2)}%"></div></div>
    <div class="qhead"><span class="qem" aria-hidden="true">${q.e}</span><div>
      <h2 class="q" id="qh" tabindex="-1">${esc(q.q)}</h2>
      ${tr(q.q)?`<p class="tr" ${trAttr()}>${esc(tr(q.q))}</p>`:''}
      ${q.hint?`<p class="hint">${esc(q.hint)}</p>`:''}
      ${q.hint&&tr(q.hint)?`<p class="hint trh" ${trAttr()}>${esc(tr(q.hint))}</p>`:''}
      ${canSpeak()?'<button class="speak" id="sp"><span aria-hidden="true">🔊</span> Vorlesen</button>':''}
    </div></div>
    ${body}
    <div class="nav">
      <button class="btn ghost" id="back">Zurück</button>
      <button class="skip" id="skip">Überspringen</button>
      <button class="btn primary" id="next" ${canNext?'':'disabled'}>${i===V.length-1?'Ergebnis zeigen':'Weiter'}</button>
    </div>`;
  const h=document.getElementById('qh'); try{h.focus({preventScroll:true});}catch(e){}
  const sp=document.getElementById('sp'); if(sp) sp.onclick=()=>speak(q.q+'. '+(q.hint||'')+' '+(q.opts?q.opts.map(o=>o.t).join('. '):''));
  document.getElementById('back').onclick=()=>{ if(i===0){renderStart();} else {cur=V[i-1].id;save();renderQ();} };
  document.getElementById('skip').onclick=()=>{ if(q.type==='text') A[q.id]=''; else delete A[q.id]; goNext(q.id); };
  document.getElementById('next').onclick=()=>{ if(q.type==='text') A[q.id]=document.getElementById('txt').value.trim(); goNext(q.id); };
  if(q.type==='text'){
    const t=document.getElementById('txt');
    t.addEventListener('keydown',e=>{if(e.key==='Enter'){A[q.id]=t.value.trim();goNext(q.id);}});
  } else {
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v;
      if(q.type==='single'){
        A[q.id]=v; save(); updateOpts(q); setTimeout(()=>{ if(cur===q.id) goNext(q.id); },280);
      } else {
        const o=q.opts.find(x=>x.v===v); let arr=Array.isArray(A[q.id])?A[q.id].slice():[];
        if(arr.includes(v)) arr=arr.filter(x=>x!==v);
        else { if(o.ex) arr=[v]; else { arr=arr.filter(x=>!q.opts.find(y=>y.v===x&&y.ex)); arr.push(v);} }
        if(arr.length) A[q.id]=arr; else delete A[q.id];
        save(); updateOpts(q);
      }
    });
  }
}
function updateOpts(q){
  const val=A[q.id];
  app.querySelectorAll('.opt').forEach(b=>{
    const on=q.type==='single'?val===b.dataset.v:has(val,b.dataset.v);
    b.setAttribute('aria-pressed',on); b.querySelector('.box').textContent=on?'✓':'';
  });
  document.getElementById('next').disabled=q.type==='single'?!val:!(Array.isArray(val)&&val.length);
}
function goNext(id){
  try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}
  const V=visible(); const i=V.findIndex(q=>q.id===id);
  if(i<V.length-1){cur=V[i+1].id;save();renderQ();window.scrollTo(0,0);}
  else {cur='__result';save();renderResult();window.scrollTo(0,0);}
}

/* ---------- Ergebnis ---------- */
function answerText(q,v){
  if(v==null||v==='') return null;
  if(q.type==='text') return v;
  if(q.type==='single'){const o=q.opts.find(o=>o.v===v);return o?o.t:v;}
  return v.map(x=>{const o=q.opts.find(o=>o.v===x);return o?o.t:x;});
}
function buildJSON(res){
  const ort=(A.ort||'').trim();
  const beispiel=res.ranked[0]?res.ranked[0].j.s:'Lagerhelfer';
  return {
    fragen_liste:Q.map(q=>({id:q.id,teil:TEILE[q.teil],frage:q.q,typ:q.type==='single'?'auswahl':q.type==='multi'?'mehrfachauswahl':'offene_antwort',optionen:q.opts?q.opts.map(o=>o.t):null,...(q.showIf?{bedingung:'Nur wenn: Praktikum = Ja'}:{})})),
    antworten:visible().map(q=>({frage_id:q.id,frage:q.q,antwort:answerText(q,A[q.id])})).filter(a=>a.antwort!=null&&!(Array.isArray(a.antwort)&&!a.antwort.length)),
    berufsvorschlaege:res.ranked.map(r=>({beruf:r.j.n,begruendung:r.begr,passung_prozent:r.pct,berufsfeld:FELDER[r.j.fam],aehnliche_berufe:r.sim.map(o=>o.n)})),
    weitere_berufe:res.more.map(r=>({beruf:r.j.n,passung_prozent:r.pct,berufsfeld:FELDER[r.j.fam]})),
    berufsfelder:res.fields.map(f=>({berufsfeld:f.name,passung_prozent:f.pct})),
    hinweis_stellensuche:`Such im Internet nach deinem Beruf und deinem Ort. Schreib zum Beispiel: „${beispiel} ${ort||'Nürnberg'}“. Gute Seiten sind die Jobbörse der Arbeitsagentur (arbeitsagentur.de) und Indeed. Hilfreiche Suchwörter sind: Helfer, Aushilfe, ohne Ausbildung, Quereinsteiger oder Ausbildung 2027. (m/w/d) in einer Anzeige heißt: Die Stelle ist für alle. Du kannst auch direkt im Laden oder in der Firma fragen. Die Berufsberatung der Agentur für Arbeit hilft dir kostenlos.`
  };
}
function jobsucheUrl(j,ort){
  const p=new URLSearchParams({angebotsart:j.typ==='A'?'4':'1',was:j.s}); if(ort) p.set('wo',ort);
  return 'https://www.arbeitsagentur.de/jobsuche/suche?'+p.toString();
}
function renderResult(){
  screen='result';
  const res=evaluate(A); const ort=(A.ort||'').trim();
  const datum=new Date().toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});
  const fitLabel=p=>p>=80?'Passt sehr gut':p>=60?'Passt gut':'Passt auch';
  const items=res.ranked.map((r,i)=>{
    const j=r.j; const phrase=j.typ==='A'?`${j.s} Ausbildung ${ort}`:`${j.s} ${ort}`;
    return `<li class="job">
      <div class="rank" aria-label="Platz ${i+1}">${i+1}</div>
      <div>
        <h3>${esc(j.n)}</h3>
        <div class="fitrow"><div class="fitbar" aria-hidden="true"><div style="width:${r.pct}%"></div></div><strong>${r.pct} % Passung</strong></div>
        <div class="tags"><span class="tag fit">${fitLabel(r.pct)}</span><span class="tag">${FE[j.fam]} ${esc(FELDER[j.fam])}</span><span class="tag">${esc(j.info)}</span></div>
        <p class="why">${esc(r.begr)}</p>
        <p class="what">Was machst du da? ${esc(j.w)}</p>
        ${(r.notes.concat(j.hinweis?[j.hinweis]:[])).map(n=>`<p class="note">ℹ️ ${esc(n)}</p>`).join('')}
        <p class="sim"><strong>Ähnliche Berufe:</strong> ${r.sim.map(o=>esc(o.n)).join(', ')}</p>
        <a class="search" href="${jobsucheUrl(j,ort)}" target="_blank" rel="noopener">🔎 Stellen suchen: ${esc(phrase.trim())}</a>
      </div></li>`;
  }).join('');
  const fieldsHtml=res.fields.slice(0,6).map(f=>`<li><span class="fe" aria-hidden="true">${f.e}</span><span class="fn">${esc(f.name)}</span><strong>${f.pct} %</strong><div class="fitbar" aria-hidden="true"><div style="width:${f.pct}%"></div></div></li>`).join('');
  const moreHtml=res.more.map((r,i)=>`<li><span class="mr">${i+11}.</span><span class="mn">${esc(r.j.n)}<br><small class="muted">${FE[r.j.fam]} ${esc(FELDER[r.j.fam])} · ${esc(r.j.info)}</small></span><strong>${r.pct} %</strong></li>`).join('');
  const dreamBox=res.traum&&!res.dreamHit?`<div class="dream"><strong>Dein Traumberuf: ${esc(res.traum)}</strong><br>Dieser Beruf ist nicht in unserer Liste. Das ist nicht schlimm! Sprich mit deiner Lehrkraft oder der Berufsberatung darüber. Vielleicht gibt es einen Weg dorthin.</div>`:'';
  const beispiel=res.ranked[0]?res.ranked[0].j.s:'Lagerhelfer';
  const json=JSON.stringify(buildJSON(res),null,2);
  app.innerHTML=`
    <div class="sheet-head"><h1 style="margin:0">Dein Ergebnisblatt</h1><span class="muted">${datum}</span></div>
    <p class="muted" style="margin-top:8px">Diese 10 Berufe passen zu deinen Antworten. Platz 1 passt am besten. Die Prozentzahl zeigt, wie gut der Beruf zu deinen Antworten passt. Sie ist eine Schätzung, keine Note.</p>
    <section class="pdfbox">
      <h2>Ergebnis an deine Lehrkraft schicken</h2>
      <label for="name">Dein Name</label>
      <input type="text" id="name" placeholder="Vorname und Nachname" value="${esc(A._name||'')}" autocomplete="name">
      <button class="btn primary" id="pdf">📄 Als PDF speichern</button>
      <p class="muted" id="pdfmsg">Danach schickst du die PDF-Datei in Teams an deine Lehrkraft.</p>
    </section>
    ${dreamBox}
    <ol class="jobs">${items}</ol>
    <section class="extra">
      <h2>Deine stärksten Berufsfelder</h2>
      <p class="muted">Ein Berufsfeld ist eine Gruppe von ähnlichen Berufen.</p>
      <ul class="fields">${fieldsHtml}</ul>
    </section>
    ${moreHtml?`<section class="extra">
      <h2>Diese Berufe passen auch</h2>
      <p class="muted">Schau dir diese Berufe auch an. Vielleicht ist etwas für dich dabei.</p>
      <ol class="more">${moreHtml}</ol>
    </section>`:''}
    <section class="box-info">
      <h2>So suchst du nach Stellenanzeigen</h2>
      <ol>
        <li>Nimm einen Beruf von deiner Liste. Fang mit Platz 1 an.</li>
        <li>Öffne die <a href="https://www.arbeitsagentur.de/jobsuche/" target="_blank" rel="noopener">Jobbörse der Arbeitsagentur</a> oder Google.</li>
        <li>Schreib den Beruf und deinen Ort. Zum Beispiel: „${esc(beispiel)} ${esc(ort||'Nürnberg')}“.</li>
        <li>Achte auf diese Wörter: Helfer, Aushilfe, ohne Ausbildung, Quereinsteiger, Ausbildung 2027.</li>
        <li>In Anzeigen steht oft (m/w/d). Das heißt: Die Stelle ist für alle.</li>
        <li>Frag auch direkt im Laden oder in der Firma. Das klappt oft gut!</li>
        <li>Hol dir Hilfe: Die Berufsberatung der Agentur für Arbeit ist kostenlos. Auch deine Lehrkraft hilft dir.</li>
      </ol>
    </section>
    <details>
      <summary>Für Lehrkräfte: Ergebnis als JSON</summary>
      <p class="muted" style="margin:10px 0 0;font-size:.9rem">Enthält alle Fragen, die Antworten, die 10 Vorschläge und den Hinweis zur Stellensuche. Achtung: Die Antworten können persönliche Angaben enthalten.</p>
      <textarea id="json" readonly>${esc(json)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="copy">JSON kopieren</button></div>
    </details>
    <div class="row foot">
      <button class="btn ghost" id="edit">Antworten ändern</button>
      <button class="btn ghost" id="restart">Neu anfangen</button>
    </div>`;
  document.getElementById('copy').onclick=async e=>{
    const ta=document.getElementById('json'); let ok=false;
    try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(err){try{ta.select();ok=document.execCommand('copy');}catch(e2){}}
    e.target.textContent=ok?'Kopiert ✓':'Bitte Text markieren und kopieren';
  };
  const nm=document.getElementById('name'); nm.oninput=()=>{A._name=nm.value;save();};
  document.getElementById('pdf').onclick=()=>savePdf(res);
  document.getElementById('edit').onclick=()=>{cur=Q[0].id;save();renderQ();window.scrollTo(0,0);};
  const rs=document.getElementById('restart'); let armed=false;
  rs.onclick=()=>{ if(!armed){armed=true;rs.textContent='Wirklich alles löschen?';return;} clearSave();A={};renderStart();window.scrollTo(0,0); };
  try{document.querySelector('h1').setAttribute('tabindex','-1');document.querySelector('h1').focus({preventScroll:true});}catch(e){}
}

/* ---------- PDF ---------- */
function pdfText(t){return String(t).replace(/[^\x20-\x7E\u00A0-\u00FF\u2013\u2014\u201E\u201C\u201D\u2018\u2019\u2022\u20AC]/g,'').replace(/\s+/g,' ').trim();}
function makePdf(res,name){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const L=18,W=174,INK=[19,49,92],MUT=[79,97,128]; let y=22;
  const block=(txt,{size=11,style='normal',color=INK,x=L,w=W,gap=1.5}={})=>{
    doc.setFont('helvetica',style);doc.setFontSize(size);doc.setTextColor(...color);
    const lines=doc.splitTextToSize(pdfText(txt),w); const lh=size*0.45;
    lines.forEach(l=>{ if(y+lh>282){doc.addPage();y=20;} doc.text(l,x,y); y+=lh; }); y+=gap;
  };
  const ort=(A.ort||'').trim();
  const datum=new Date().toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});
  block('Mein Ergebnisblatt',{size:22,style:'bold',gap:1});
  block('Berufs-Check für BVJ und BIK',{size:11,color:MUT,gap:5});
  block('Name: '+(name||'–'),{size:12,style:'bold',gap:1});
  block('Datum: '+datum+(ort?'     Wohnort: '+ort:''),{size:11,color:MUT,gap:4});
  doc.setDrawColor(...INK);doc.setLineWidth(0.4);doc.line(L,y,L+W,y); y+=7;
  block('Diese 10 Berufe passen zu meinen Antworten. Platz 1 passt am besten.',{size:11,gap:5});
  res.ranked.forEach((r,i)=>{
    const j=r.j; if(y>255){doc.addPage();y=20;}
    const top=y;
    doc.setFillColor(255,210,63);doc.circle(L+4.5,top-1.5,4.5,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...INK);
    doc.text(String(i+1),L+4.5,top,{align:'center'});
    block(j.n,{size:13,style:'bold',x:L+13,w:W-13,gap:0.5});
    block('Passung: '+r.pct+' %   |   '+FELDER[j.fam]+'   |   '+j.info,{size:10,color:MUT,x:L+13,w:W-13,gap:1.5});
    block(r.begr,{size:11,x:L+13,w:W-13,gap:1});
    block('Was machst du da? '+j.w,{size:10,color:MUT,x:L+13,w:W-13,gap:1});
    r.notes.concat(j.hinweis?[j.hinweis]:[]).forEach(n=>block('Hinweis: '+n,{size:10,color:MUT,x:L+13,w:W-13,gap:1}));
    block('Ähnliche Berufe: '+r.sim.map(o=>o.n).join(', '),{size:10,x:L+13,w:W-13,gap:1});
    block('Suchwort: '+(j.typ==='A'?j.s+' Ausbildung':j.s)+(ort?' '+ort:''),{size:10,style:'bold',x:L+13,w:W-13,gap:5});
  });
  if(y>235){doc.addPage();y=20;}
  y+=2; block('Meine stärksten Berufsfelder',{size:14,style:'bold',gap:2});
  res.fields.slice(0,6).forEach(f=>block(f.name+': '+f.pct+' %',{size:11,gap:1}));
  if(res.more.length){
    if(y>235){doc.addPage();y=20;}
    y+=4; block('Diese Berufe passen auch',{size:14,style:'bold',gap:2});
    res.more.forEach((r,i)=>block((i+11)+'. '+r.j.n+' ('+r.pct+' %, '+r.j.info+')',{size:11,gap:1}));
  }
  if(y>230){doc.addPage();y=20;}
  y+=4; block('So suchst du nach Stellenanzeigen',{size:14,style:'bold',gap:2});
  ['Nimm einen Beruf von deiner Liste. Fang mit Platz 1 an.',
   'Öffne die Jobbörse der Arbeitsagentur (arbeitsagentur.de/jobsuche) oder Google.',
   'Schreib den Beruf und deinen Ort. Zum Beispiel: „'+(res.ranked[0]?res.ranked[0].j.s:'Lagerhelfer')+' '+(ort||'Nürnberg')+'“.',
   'Achte auf diese Wörter: Helfer, Aushilfe, ohne Ausbildung, Quereinsteiger, Ausbildung 2027.',
   '(m/w/d) in einer Anzeige heißt: Die Stelle ist für alle.',
   'Frag auch direkt im Laden oder in der Firma.',
   'Die Berufsberatung der Agentur für Arbeit hilft dir kostenlos.'
  ].forEach((t,i)=>block((i+1)+'. '+t,{size:11,gap:1.2}));
  const n=doc.getNumberOfPages();
  for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...MUT);doc.text('Berufs-Check – Seite '+p+' von '+n,L+W,290,{align:'right'});}
  return doc;
}
async function savePdf(res){
  const msg=t=>{document.getElementById('pdfmsg').textContent=t;};
  const name=(document.getElementById('name').value||'').trim();
  if(!name){msg('Bitte schreib zuerst deinen Namen in das Feld.');document.getElementById('name').focus();return;}
  if(!window.jspdf){msg('Das PDF geht gerade nicht. Prüfe deine Internetverbindung und lade die Seite neu.');return;}
  let doc; try{doc=makePdf(res,name);}catch(e){msg('Das PDF konnte nicht erstellt werden. Bitte versuch es nochmal.');return;}
  const fn='Berufs-Check_'+name.replace(/[^\p{L}\p{N}]+/gu,'_').replace(/^_|_$/g,'')+'.pdf';
  const inViewer=!!(window.claude&&window.claude.use);
  if(inViewer){
    let dl=null; try{dl=await window.claude.use('downloads');}catch(e){}
    if(!dl){msg('Speichern geht hier leider nicht. Frag deine Lehrkraft.');return;}
    try{await dl.save({filename:fn,data:doc.output('blob')}); msg('Gespeichert! Öffne jetzt Teams und schick die Datei „'+fn+'“ an deine Lehrkraft.');}
    catch(e){const c=e&&e.code; msg(c==='declined'?'Nicht gespeichert. Klick nochmal auf den Knopf, wenn du das PDF willst.':c==='rate_limited'?'Einen Moment bitte, dann nochmal klicken.':'Speichern geht hier leider nicht. Frag deine Lehrkraft.');}
  } else {
    try{doc.save(fn); msg('Das PDF ist in deinem Download-Ordner. Öffne jetzt Teams und schick die Datei „'+fn+'“ an deine Lehrkraft.');}catch(e){msg('Speichern geht hier leider nicht. Frag deine Lehrkraft.');}
  }
}

(function initLang(){
  const saved=load(); if(saved&&saved.L&&LANGS.some(x=>x.c===saved.L)) L=saved.L;
  const sel=document.getElementById('lang');
  sel.innerHTML=LANGS.map(x=>`<option value="${x.c}" ${x.c===L?'selected':''}>${x.n}</option>`).join('');
  sel.onchange=()=>{L=sel.value; save(); rerender();};
})();
function rerender(){ if(screen==='result') renderResult(); else if(screen==='q') renderQ(); else renderStart(); }
renderStart();
</script>
</body>
